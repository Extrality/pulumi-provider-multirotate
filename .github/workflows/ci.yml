name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: make test

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: pulumi/actions@v6
      # Regenerating the SDK is the real check that the schema is valid and
      # that the generated TypeScript compiles.
      - run: make sdk
      - name: Report SDK drift
        run: |
          if ! git diff --quiet -- sdk/; then
            echo "::notice::sdk/ differs from the committed SDK (expected between releases)."
            git diff --stat -- sdk/
          fi

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
