name: release-prepare

#   1. this workflow regenerates the Node.js SDK pinned to the new version and
#      opens a `release/vX.Y.Z` pull request;
#   2. release-publish.yml tags the merge commit and publishes the provider
#      binaries once that PR is merged.
#
# The tag has to land on the merge commit so that
# `pnpm add github:Extrality/pulumi-provider-multirotate#vX.Y.Z&path:/sdk/nodejs`
# resolves to an SDK whose version matches the released plugin.
#
# Heads-up: this PR is opened with GITHUB_TOKEN, so GitHub starts its checks in
# an approval-required state. Click "Approve workflows to run" in the merge box
# before the required checks can pass.
#
# .goreleaser.yml sets `prerelease: auto`, so any
# version with a suffix (0.2.0-rc.1) is marked as a prerelease automatically.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a semver version (expected e.g. 0.1.0)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit: a later step git-pushes a branch, which needs the
          # credential that the checkout persists.
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Ensure the tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          # Keep in sync with ci.yml, or the release PR will fail its own
          # sdk_check.
          pulumi-version: 3.259.0

      - name: Test
        run: make test

      - name: Regenerate the SDK at the release version
        env:
          VERSION: ${{ inputs.version }}
        run: make sdk VERSION="${VERSION}"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PR_BODY: |
            Restamps the Node.js SDK at `${{ inputs.version }}`.

            **Before merging:** click **Approve workflows to run** in the merge box.
            This PR was opened by `github-actions[bot]` using `GITHUB_TOKEN`, so GitHub
            holds its checks in an approval-required state and the required contexts
            stay `expected` until a human with write access releases them.

            Merging this PR triggers `release-publish`, which tags the merge commit
            `v${{ inputs.version }}` and uploads the provider binaries. Closing it
            without merging releases nothing.
        run: |
          BRANCH="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add -A sdk

          if git diff --cached --quiet; then
            echo "::error::sdk/ is already at version ${VERSION}; nothing to release."
            exit 1
          fi

          # `chore:` keeps this commit out of the release notes, per the
          # changelog filters in .goreleaser.yml.
          git commit -m "chore: release v${VERSION}"
          git push --force origin "${BRANCH}"

          existing=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')
          if [ -n "${existing}" ]; then
            echo "::notice::updated existing release PR #${existing}"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: release v${VERSION}" \
            --body "${PR_BODY}"
