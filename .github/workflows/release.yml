name: release

# Releasing is a single button. It:
#   1. regenerates the Node.js SDK pinned to the new version,
#   2. commits it to main,
#   3. tags that commit,
#   4. publishes the provider binaries as GitHub release assets.
#
# Step 3 must happen *after* step 2 so that
# `pnpm add github:Extrality/pulumi-provider-multirotate#vX.Y.Z&path:/sdk/nodejs`
# resolves to an SDK whose version matches the released plugin.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a semver version (expected e.g. 0.1.0)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure the tag does not already exist
        run: |
          if git rev-parse "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: pulumi/actions@v6

      - name: Test
        run: make test

      - name: Generate the Node.js SDK
        run: make sdk VERSION=${{ inputs.version }}

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sdk
          if git diff --cached --quiet; then
            echo "SDK unchanged; tagging the current commit."
          else
            git commit -m "release: v${VERSION} SDKs"
            git push origin HEAD:main
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish provider binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}

      - name: Mark as prerelease
        if: ${{ inputs.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ inputs.version }}" --prerelease
